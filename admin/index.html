<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم المتجر</title><link rel="stylesheet" href="../css/admin.css"></head><body><header><h2>لوحة تحكم دروب شوبينج</h2><a href="../index.html">عرض المتجر ↗</a></header><main><section id="login"><h2>تسجيل دخول المدير</h2><form id="loginForm"><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="password" type="password" placeholder="كلمة المرور" required><button>دخول</button></form></section><section id="dashboard" hidden><div class="bar"><h2>إدارة المتجر</h2><button id="logout">تسجيل خروج</button></div><nav><button data-tab="products">المنتجات</button><button data-tab="categories">الأقسام</button><button data-tab="orders">الطلبات</button><button data-tab="delivery">التوصيل</button></nav><section id="products"><h3>إضافة منتج</h3><form id="productForm"><input name="name" placeholder="اسم المنتج" required><input name="slug" placeholder="المعرّف الإنجليزي (مثال: smart-watch)" pattern="[a-z0-9-]+" required><input name="price" type="number" min="0" placeholder="السعر بالدينار" required><input name="stock" type="number" min="0" placeholder="الكمية" required><select name="category"><option value="">بدون قسم</option></select><label><input type="checkbox" name="published"> إظهار المنتج في المتجر</label><button>إضافة المنتج</button></form><h3>المنتجات الموجودة</h3><div id="productList"></div></section><section id="categories" hidden><h3>إضافة قسم</h3><form id="categoryForm"><input name="name" placeholder="اسم القسم" required><input name="slug" placeholder="المعرّف الإنجليزي" pattern="[a-z0-9-]+" required><button>إضافة قسم</button></form><div id="categoryList"></div></section><section id="orders" hidden><h3>الطلبات</h3><div id="orderList"></div></section><section id="delivery" hidden><h3>مناطق التوصيل</h3><form id="deliveryForm"><input name="governorate" placeholder="المحافظة" required><input name="zone_name" placeholder="المنطقة" required><input name="fee_iqd" type="number" min="0" placeholder="أجور التوصيل بالدينار" required><button>إضافة منطقة</button></form><div id="deliveryList"></div></section></section><p id="message" role="status"></p></main><script src="../js/admin.js"></script></body></html>
